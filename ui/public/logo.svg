<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.9" />
    </linearGradient>

    <!-- Primary Chevron Gradients -->
    <linearGradient id="leftLegGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0052d4" />
      <stop offset="50%" stop-color="#4364f7" />
      <stop offset="100%" stop-color="#6fb1fc" />
    </linearGradient>

    <linearGradient id="rightLegGrad" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0052d4" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas: High-Tech Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Circuit Grid Backdrop -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="96" y1="16" x2="96" y2="496" />
    <line x1="176" y1="16" x2="176" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="336" y1="16" x2="336" y2="496" />
    <line x1="416" y1="16" x2="416" y2="496" />
    <line x1="16" y1="96" x2="496" y2="96" />
    <line x1="16" y1="176" x2="496" y2="176" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="336" x2="496" y2="336" />
    <line x1="16" y1="416" x2="496" y2="416" />
  </g>

  <!-- Center Ambient Radial Energy Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGlow)" filter="url(#softGlow)" />

  <!-- Circuit Micro-Traces and Vias -->
  <g stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.3" fill="none" stroke-linecap="round">
    <!-- Left trace -->
    <path d="M 80 400 L 130 400 L 175 350" />
    <circle cx="80" cy="400" r="4" fill="#00f2fe" fill-opacity="0.6" />
    <!-- Right trace -->
    <path d="M 432 400 L 382 400 L 337 350" />
    <circle cx="432" cy="400" r="4" fill="#00f2fe" fill-opacity="0.6" />
    <!-- Top apex trace -->
    <path d="M 256 60 L 256 95" />
    <circle cx="256" cy="60" r="3.5" fill="#4facfe" fill-opacity="0.8" />
  </g>

  <!-- THE AXIOM "A" GLYPH: Precision Delta & Silicon Node -->
  <!-- Left Leg (Ascending Power & Logic Path) -->
  <path d="M 120 410 L 236 122 Q 256 75 276 122 L 392 410 L 332 410 L 256 220 L 180 410 Z" 
        fill="url(#leftLegGrad)" opacity="0.95" filter="url(#coreGlow)" />

  <!-- Right Leg Overlay (Prismatic Cyan Facet) -->
  <path d="M 256 98 L 276 122 L 392 410 L 336 410 L 256 220 Z" 
        fill="url(#rightLegGrad)" />

  <!-- Central Dynamic Floating Crossbar: Precision Waveform Pulse -->
  <!-- Represents zero-time delta step & logic transition -->
  <g filter="url(#coreGlow)">
    <!-- Base Bar -->
    <polygon points="172,316 340,316 322,342 190,342" fill="url(#crossbarGrad)" />
    <!-- Core Energy Ray -->
    <line x1="160" y1="329" x2="352" y2="329" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Center Logic Gate Diamond Node -->
    <polygon points="256,310 268,329 256,348 244,329" fill="#ffffff" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- Silicon Pad Terminal Nodes -->
  <!-- Left Via -->
  <circle cx="150" cy="410" r="8" fill="#0d131f" stroke="#4364f7" stroke-width="3" />
  <circle cx="150" cy="410" r="3" fill="#00f2fe" />

  <!-- Right Via -->
  <circle cx="362" cy="410" r="8" fill="#0d131f" stroke="#00f2fe" stroke-width="3" />
  <circle cx="362" cy="410" r="3" fill="#ffffff" />

  <!-- Apex Quantum Core Node -->
  <circle cx="256" cy="110" r="6" fill="#ffffff" filter="url(#coreGlow)" />
</svg>
