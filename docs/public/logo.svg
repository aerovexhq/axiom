<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#06090e" />
    </radialGradient>

    <!-- Electric Cyan Facet Gradient -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Royal Cobalt Facet Gradient -->
    <linearGradient id="blueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Central Crossbar Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Circuit Trace Stroke -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base with Precision Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.35" />

  <!-- Subtle High-Tech Circuit Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="140" y1="20" x2="140" y2="492" />
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="372" y1="20" x2="372" y2="492" />
    <line x1="20" y1="140" x2="492" y2="140" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="20" y1="372" x2="492" y2="372" />
  </g>

  <!-- Left Facet: Ascending Delta Blade (Electric Cyan) -->
  <polygon points="256,76 256,236 176,416 132,416 232,106" fill="url(#cyanFacet)" />

  <!-- Left Bevel Shimmer Highlight -->
  <polygon points="232,106 132,416 108,416 216,128 256,76" fill="#a5f3fc" />

  <!-- Right Facet: Descending Delta Blade (Royal Cobalt Blue) -->
  <polygon points="256,76 280,106 380,416 336,416 256,236" fill="url(#blueFacet)" />

  <!-- Right Bevel Contrast Facet -->
  <polygon points="280,106 256,76 296,128 404,416 380,416" fill="#38bdf8" fill-opacity="0.85" />

  <!-- Inner Dark Geometric Cavity -->
  <polygon points="256,236 186,376 326,376" fill="#030712" fill-opacity="0.75" />

  <!-- Horizontal Silicon Horizon Bar -->
  <polygon points="144,324 368,324 350,352 162,352" fill="#0369a1" />
  <line x1="126" y1="338" x2="386" y2="338" stroke="url(#beamGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Central Synchronous Energy Core Diamond -->
  <polygon points="256,316 278,338 256,360 234,338" fill="#ffffff" stroke="#00f2fe" stroke-width="3" />
  <circle cx="256" cy="338" r="4.5" fill="#00f2fe" />

  <!-- Apex Clock Input Trace & Micro-Via Node -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="url(#traceGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="36" r="6" fill="#00f2fe" stroke="#ffffff" stroke-width="2" />
  <circle cx="256" cy="76" r="7" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5" />

  <!-- Base Contact Terminals (Ground and Vdd Rails) -->
  <circle cx="132" cy="416" r="7" fill="#00f2fe" stroke="#0b0f19" stroke-width="2" />
  <circle cx="380" cy="416" r="7" fill="#38bdf8" stroke="#0b0f19" stroke-width="2" />

  <!-- Horizontal Bus Extensions -->
  <g stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="56" y1="416" x2="114" y2="416" />
    <circle cx="56" cy="416" r="4" fill="#00f2fe" />
    <line x1="398" y1="416" x2="456" y2="416" />
    <circle cx="456" cy="416" r="4" fill="#38bdf8" />
  </g>
</svg>