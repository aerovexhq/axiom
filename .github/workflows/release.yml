name: Release Axiom Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: x86_64-linux
            format: tar.gz
            use-cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: aarch64-linux
            format: tar.gz
            use-cross: true

          - os: macos-latest
            target: aarch64-apple-darwin
            name: aarch64-darwin
            format: tar.gz
            use-cross: false

          - os: macos-13
            target: x86_64-apple-darwin
            name: x86_64-darwin
            format: tar.gz
            use-cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: x86_64-windows
            format: zip
            use-cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "VERSION=v1.0.0" >> $GITHUB_ENV
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use-cross
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build Binary (Standard)
        if: "!matrix.use-cross"
        run: cargo build --release --target ${{ matrix.target }} --bin axiom --bin axiom-desktop

      - name: Build Binary (Cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }} --bin axiom --bin axiom-desktop

      - name: Package Unix Archive (tar.gz)
        if: "matrix.format == 'tar.gz'"
        shell: bash
        run: |
          ARCHIVE="axiom-${VERSION}-${{ matrix.name }}.tar.gz"
          mkdir -p staging
          BIN_PATH="target/${{ matrix.target }}/release/axiom"
          DESKTOP_PATH="target/${{ matrix.target }}/release/axiom-desktop"
          if command -v strip &>/dev/null && [ "${{ matrix.target }}" != "aarch64-unknown-linux-gnu" ]; then
            strip "${BIN_PATH}" || true
            [ -f "${DESKTOP_PATH}" ] && strip "${DESKTOP_PATH}" || true
          fi
          cp "${BIN_PATH}" staging/axiom
          [ -f "${DESKTOP_PATH}" ] && cp "${DESKTOP_PATH}" staging/axiom-desktop
          chmod +x staging/*
          tar -czf "${ARCHIVE}" -C staging .
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE_FILE=${ARCHIVE}" >> $GITHUB_ENV
          echo "SHA_FILE=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Package Windows Archive (zip)
        if: "matrix.format == 'zip'"
        shell: bash
        run: |
          ARCHIVE="axiom-${VERSION}-${{ matrix.name }}.zip"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/axiom.exe staging/axiom.exe
          if [ -f "target/${{ matrix.target }}/release/axiom-desktop.exe" ]; then
            cp target/${{ matrix.target }}/release/axiom-desktop.exe staging/axiom-desktop.exe
          fi
          7z a "${ARCHIVE}" ./staging/*
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE_FILE=${ARCHIVE}" >> $GITHUB_ENV
          echo "SHA_FILE=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiom-${{ matrix.name }}
          path: |
            axiom-*.tar.gz
            axiom-*.zip
            axiom-*.sha256
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "VERSION=v1.0.0" >> $GITHUB_ENV
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate Consolidated SHA256 Checksums
        shell: bash
        run: |
          cd dist-release
          sha256sum axiom-*.tar.gz axiom-*.zip > checksums.sha256
          cat checksums.sha256

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Axiom EDA ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*
