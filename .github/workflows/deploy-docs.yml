name: Deploy Axiom Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "ui/**"
      - "scripts/**"
      - ".github/workflows/deploy-docs.yml"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            docs/package-lock.json
            ui/package-lock.json

      - name: Install UI dependencies & Build Web Studio
        run: |
          npm --prefix ui install
          npm --prefix ui run build
          mkdir -p docs/public/studio
          cp -r ui/dist/* docs/public/studio/

      - name: Ensure CNAME file
        run: |
          echo "axiom.aerovex.net" > CNAME
          echo "axiom.aerovex.net" > docs/public/CNAME

      - name: Install docs dependencies & Build VitePress
        run: |
          npm --prefix docs install
          npm --prefix docs run docs:build
          cp CNAME docs/.vitepress/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
