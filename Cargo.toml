[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/syntax",
    "crates/ir",
    "crates/jit",
    "crates/sim",
    "crates/telemetry",
    "crates/desktop",
    "crates/cli",
    "crates/wasm",
    "crates/lsp",
    "crates/sta",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["Axiom EDA Contributors"]
license = "MIT"
repository = "https://github.com/aerovexhq/axiom"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
lasso = { version = "0.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
hashbrown = { version = "0.15", features = ["serde"] }
bumpalo = "3.16"
cranelift-codegen = "0.136.0-rc.1"
cranelift-frontend = "0.136.0-rc.1"
cranelift-jit = "0.136.0-rc.1"
cranelift-module = "0.136.0-rc.1"
axiom-core = { path = "crates/core" }
axiom-syntax = { path = "crates/syntax" }
axiom-ir = { path = "crates/ir" }
axiom-jit = { path = "crates/jit", default-features = false }
axiom-sim = { path = "crates/sim" }
axiom-telemetry = { path = "crates/telemetry" }
axiom-desktop = { path = "crates/desktop" }
axiom-wasm = { path = "crates/wasm" }
axiom-lsp = { path = "crates/lsp" }
axiom-sta = { path = "crates/sta" }
serde_json = "1.0"

[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
