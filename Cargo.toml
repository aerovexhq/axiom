[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/syntax",
    "crates/ir",
    "crates/jit",
    "crates/sim",
    "crates/telemetry",
    "crates/desktop",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Axiom EDA Contributors"]
license = "MIT"
repository = "https://github.com/larvance/axiom"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
lasso = { version = "0.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
hashbrown = { version = "0.15", features = ["serde"] }
bumpalo = "3.16"
cranelift-codegen = "0.136.0-rc.1"
cranelift-frontend = "0.136.0-rc.1"
cranelift-jit = "0.136.0-rc.1"
cranelift-module = "0.136.0-rc.1"
betterado-core = { path = "crates/core" }
betterado-syntax = { path = "crates/syntax" }
betterado-ir = { path = "crates/ir" }
betterado-jit = { path = "crates/jit" }
betterado-sim = { path = "crates/sim" }
betterado-telemetry = { path = "crates/telemetry" }
betterado-desktop = { path = "crates/desktop" }
zstd = "0.13"
tiny_http = "0.12"
serde_json = "1.0"
