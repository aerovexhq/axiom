[package]
name = "axiom-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "axiom_desktop"
path = "src/lib.rs"

[[bin]]
name = "axiom-desktop"
path = "src/main.rs"

[dependencies]
axiom-core = { workspace = true }
axiom-syntax = { workspace = true }
axiom-ir = { workspace = true }
axiom-jit = { workspace = true, features = ["native-jit"] }
axiom-sim = { workspace = true }
axiom-telemetry = { workspace = true }
axiom-sta = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
hashbrown = { workspace = true }
tauri = { version = "2" }
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2" }
